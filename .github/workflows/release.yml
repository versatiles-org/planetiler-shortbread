name: Publish a Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading "v" (1.0.0, 1.2.3, 1.0.0-pre1)'
        required: true
        default: ''
      image_tags:
        description: 'Extra docker image tags, comma separated. Empty means "latest" for a stable version and no extra tag for a prerelease.'
        required: false
        default: ''

# never publish two releases at once
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    # inputs are passed through the environment, never interpolated into a shell command
    env:
      VERSION: ${{ inputs.version }}
      IMAGE_TAGS_INPUT: ${{ inputs.image_tags }}
    steps:
      - name: Validate the version
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "Bad version '$VERSION': expected 1.2.3 or 1.2.3-pre1, with no leading v"
            exit 1
          fi

      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # The checkout is shallow and fetches no tags, so a local `git rev-parse` would never find one and this check
      # would always pass. Ask the remote instead.
      - name: Check the tag does not exist yet
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists. Aborting the release."
            exit 1
          fi

      - name: Set the release version
        run: ./mvnw -B -ntp versions:set versions:commit -DnewVersion="$VERSION"

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Check the executable jar is wired to ShortbreadMain
        run: |
          unzip -p target/*with-deps.jar META-INF/MANIFEST.MF |
            grep -q 'Main-Class: org.versatiles.shortbread.ShortbreadMain'

      # --help makes Planetiler print its arguments and exit before it looks at any source, so this proves the jar
      # starts without downloading anything
      - name: Smoke-test the jar
        run: java -jar target/*with-deps.jar --help > /dev/null

      - name: Collect release artifacts
        run: |
          mv target/*with-deps.jar planetiler-shortbread.jar
          sha256sum planetiler-shortbread.jar > planetiler-shortbread.jar.sha256
          md5sum planetiler-shortbread.jar > planetiler-shortbread.jar.md5

      - name: Decide the extra image tags
        id: image
        run: |
          tags="$IMAGE_TAGS_INPUT"
          if [ -z "$tags" ]; then
            case "$VERSION" in
              *-*) tags="" ;;      # a prerelease only gets its own version tag
              *) tags="latest" ;;
            esac
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the container image
        env:
          IMAGE_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          if [ -n "$IMAGE_TAGS" ]; then
            ./mvnw -B -ntp -Pjib-multi-arch -DskipTests -Djib.to.tags="$IMAGE_TAGS" package jib:build --file pom.xml
          else
            ./mvnw -B -ntp -Pjib-multi-arch -DskipTests package jib:build --file pom.xml
          fi

      # Tag only once the jar and the image are published, so a failed release leaves no tag behind. The tag marks the
      # source commit that was released; its pom still says 1.0.0-SNAPSHOT, because the version is set during the build
      # and never committed back to the repository.
      - name: Create the tag
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/v${process.env.VERSION}`,
              sha: context.sha
            })

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          tag_name: v${{ inputs.version }}
          draft: true
          files: |
            planetiler-shortbread.jar*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
