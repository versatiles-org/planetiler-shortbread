name: Publish a Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without leading "v" (1.0.0, 1.2.3, 1.0.0-pre1)'
        required: true
        default: ''
      image_tags:
        description: 'Extra docker image tags ("latest", "latest,release")'
        required: true
        default: 'latest'

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - name: Ensure version does not start with 'v'
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const version = context.payload.inputs.version;
            if (/^v/.test(version)) throw new Error("Bad version number: " + version)

      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Check tag does not exist yet
        run: |
          if git rev-parse "v${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ github.event.inputs.version }} already exists. Aborting the release."
            exit 1
          fi

      - name: Set the release version
        run: ./mvnw -B -ntp versions:set versions:commit -DnewVersion="${{ github.event.inputs.version }}"

      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Create tag
        uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: "refs/tags/v${{ github.event.inputs.version }}",
              sha: context.sha
            })

      - name: Collect release artifacts
        run: |
          mv target/*with-deps.jar planetiler-shortbread.jar
          sha256sum planetiler-shortbread.jar > planetiler-shortbread.jar.sha256
          md5sum planetiler-shortbread.jar > planetiler-shortbread.jar.md5

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          tag_name: v${{ github.event.inputs.version }}
          draft: true
          files: |
            planetiler-shortbread.jar*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the container image
        run: >-
          ./mvnw -B -ntp -Pjib-multi-arch -DskipTests
          -Djib.to.tags="${{ github.event.inputs.image_tags }}"
          package jib:build --file pom.xml
