name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# every job here only reads the repository; nothing publishes or writes back
permissions:
  contents: read

jobs:
  # When spotless:check fails the error message is a bit cryptic, so keep it in its own job
  # to make it obvious that formatting - not the build - is the problem.
  lint:
    name: Check formatting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Ensure code formatted with ./mvnw spotless:apply
        run: ./mvnw -DskipTests --batch-mode -no-transfer-progress spotless:check

  build:
    name: Java ${{ matrix.jdk }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        jdk: [ 21 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK ${{ matrix.jdk }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.jdk }}
          distribution: 'temurin'
          cache: 'maven'
      # Skip spotless, it is checked in the lint job above
      - name: Build with mvnw (linux/mac)
        if: ${{ !contains(matrix.os, 'windows') }}
        run: ./mvnw -Dspotless.check.skip --batch-mode -no-transfer-progress verify jib:buildTar --file pom.xml
      - name: Build with mvnw.cmd (windows)
        if: ${{ contains(matrix.os, 'windows') }}
        run: mvnw.cmd -Dspotless.check.skip --batch-mode -no-transfer-progress verify jib:buildTar --file pom.xml
        shell: cmd
      - name: Check the executable jar is wired to ShortbreadMain
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          unzip -p target/*with-deps.jar META-INF/MANIFEST.MF |
            grep -q 'Main-Class: org.versatiles.shortbread.ShortbreadMain'
      - name: Upload the executable jar
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v6
        with:
          name: planetiler-shortbread-jar
          path: target/*with-deps.jar

  submodule:
    name: Planetiler submodule
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout the planetiler fork that wires this module in
        uses: actions/checkout@v6
        with:
          repository: versatiles-org/planetiler
          ref: main
          path: planetiler
          submodules: false
      - name: Checkout this branch
        uses: actions/checkout@v6
        with:
          path: planetiler-shortbread
      - name: Move this branch into the planetiler checkout
        run: |
          rm -rf planetiler/planetiler-shortbread
          mv planetiler-shortbread planetiler/
      - name: Check out the planetiler-openmaptiles submodule
        working-directory: planetiler
        run: git submodule update --init planetiler-openmaptiles
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Build and test the whole reactor
        working-directory: planetiler
        run: ./mvnw -Dspotless.check.skip --batch-mode -no-transfer-progress verify --file pom.xml
      # Asking for an unknown task makes Main print every registered task and exit,
      # so this checks the wiring without starting a pipeline or downloading sources.
      - name: Check the distribution jar registers the shortbread tasks
        working-directory: planetiler
        run: |
          output=$(java -jar planetiler-dist/target/*with-deps.jar no-such-task 2>&1 || true)
          echo "$output"
          registered=$(echo "$output" | sed -n 's/.*possibilities: \[\(.*\)\].*/\1/p' | tr ',' '\n' | tr -d ' ')
          test -n "$registered" || { echo "could not read the task list"; exit 1; }
          for task in shortbread shortbread-1.1 generate-shortbread generate-shortbread-1.1; do
            echo "$registered" | grep -qx "$task" || { echo "task '$task' is not registered"; exit 1; }
          done
