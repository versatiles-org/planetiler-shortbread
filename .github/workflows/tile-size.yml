name: Tile size budget

# Generates two real extracts and fails when any compressed tile is larger than the budget, so a change that bloats
# tiles gets noticed, for example losing the address density limit. It runs weekly and on demand rather than on every
# pull request, because it downloads about 1.3 GB of input and runs for several minutes.
#
# Extracts, each generated twice, without experiments and with all of them:
# - estonia: low-zoom tiles with a long coastline, many lakes and large forests
# - noord-holland: the densest city tiles, in central Amsterdam, the worst case for addresses and POIs
#
# Budget: 500 KiB per compressed tile, at every zoom. Change the default below, or pass budget_kib to a manual run.
# Baseline when the budget was introduced (2026-09-11, extracts from June 2026), without / with all experiments:
# - estonia: largest tile 101 / 101 KiB at z7, 137 / 152 KiB at z14
# - noord-holland: largest tile 323 / 331 KiB at z14 (central Amsterdam, mostly buildings)
#
# The script prints the largest tile per zoom and its largest layer to the job summary, and the layer stats of every
# run are uploaded as an artifact, so a regression can be traced to a layer.

on:
  schedule:
    - cron: '23 3 * * 1' # Mondays, 03:23 UTC
  workflow_dispatch:
    inputs:
      budget_kib:
        description: 'Largest allowed compressed tile, in KiB'
        required: true
        default: '500'

# the job only reads the repository and uploads an artifact
permissions:
  contents: read

jobs:
  measure:
    name: ${{ matrix.area }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        area: [ estonia, noord-holland ]
    env:
      BUDGET_KIB: ${{ inputs.budget_kib || '500' }}
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'temurin'
          cache: 'maven'
      - name: Build the executable jar
        run: ./mvnw -B -ntp -DskipTests -Dspotless.check.skip package

      # the water polygons are the same for both extracts and change slowly, so a download is reused for a week;
      # --download below only fetches sources that are missing
      - name: Compute the week for the ocean cache key
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"
      - name: Restore the ocean shapefile
        uses: actions/cache@v6
        with:
          path: data/sources/water-polygons-split-3857.zip
          key: water-polygons-${{ steps.week.outputs.week }}

      - name: Generate tiles without experiments
        run: >-
          java -Xmx8g -jar target/*-with-deps.jar --area=${{ matrix.area }} --download --force
          --shortbread_experiments=none --output=data/none.mbtiles --output_layerstats=true
      - name: Generate tiles with all experiments
        run: >-
          java -Xmx8g -jar target/*-with-deps.jar --area=${{ matrix.area }} --download --force
          --shortbread_experiments=all --output=data/all.mbtiles --output_layerstats=true

      - name: Check the tile sizes against the budget
        run: >-
          python3 .github/scripts/check_tile_size.py --budget-kib "$BUDGET_KIB"
          data/none.mbtiles.layerstats.tsv.gz data/all.mbtiles.layerstats.tsv.gz
      - name: Upload the layer stats
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: layerstats-${{ matrix.area }}
          path: data/*.layerstats.tsv.gz
          if-no-files-found: ignore
